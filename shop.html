<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Shop | Ruthtech Foods</title><meta name="description" content="Shop quality foodstuffs, airtime and data. Pay on delivery or from your wallet.">
<meta name="theme-color" content="#2b1245"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="assets/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/app.css"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"><link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js"></head><body class="home" data-page="shop">
<header><a class="brandrow" href="./"><img src="assets/logo-foods.jpg" alt="" width="40" height="40"><span><b>RUTH<span>TECH</span></b><small>Foods &amp; Enterprises</small></span></a><button id="cart" class="alt ibtn" aria-label="Open cart"><span id="count" class="badge">0</span></button></header>
<main id="shop"><div id="pdp" hidden></div><div id="list"><h2>Shop</h2>
<div class="tools"><input id="q" type="search" placeholder="Search rice, oil, beans, spaghetti..." aria-label="Search products"><select id="so" aria-label="Sort products"><option value="default">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option><option value="new">Newest first</option></select></div>
<div class="chips" id="chips"></div><div id="rows"></div></div></main>
<footer class="foot"><span>Ruthtech Foods &amp; Enterprises, Akure</span><a id="fwa" href="#" rel="noopener">Order help on WhatsApp</a></footer>
<aside id="drawer" aria-label="Cart"><div class="row" style="justify-content:space-between"><h2>Your cart</h2><button id="close" class="alt">Close</button></div><div id="lines"></div>
<div class="row"><input id="pc" placeholder="Promo code" style="flex:1"><button id="pa" class="alt">Apply</button></div><p class="line"><span>Discount</span><b id="dc"></b></p><p class="line"><span>Items</span><b id="sub"></b></p><p class="line"><span>Delivery</span><b id="fee"></b></p><p class="line"><span>Total</span><b id="total"></b></p>
<form class="f" id="co"><input name="nm" placeholder="Full name" required autocomplete="name"><input name="ph" type="tel" placeholder="Phone number" required autocomplete="tel"><input name="em" type="email" placeholder="Email (for your receipt)" required autocomplete="email"><input name="ad" placeholder="Delivery address" required autocomplete="street-address"><select name="zn" id="zn"><option value="">Delivery zone</option></select></form>
<p id="wbal" class="mut"></p><button id="wallet-btn" class="go" hidden>Pay with wallet</button><button id="req-btn" class="alt" hidden>Ask someone to pay for me</button><button id="loc" type="button" class="alt">Share my location with the rider</button><button id="place">Place order, pay on delivery</button><button id="sh" class="alt">Share cart link</button></aside>
<div id="install" hidden><span>Install Ruthtech for faster ordering.</span><button id="inst" class="go">Install</button><button id="later" class="alt">Not now</button></div>
<script type="module" src="js/store.js"></script></body></html>
